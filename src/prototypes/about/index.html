<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!--
      PROTOTYPE — About 页结构变体（一次性代码，不合并）
      问题：关于页「换几种样式」——四种结构不同的方案，通过 ?variant=A|B|C|D 切换。
      运行：pnpm dev → http://localhost:5273/src/prototypes/about/index.html
      状态：variant 与微信二维码开合只在内存里，不持久化。
    -->
    <link rel="stylesheet" href="/src/styles/globals.css" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg-page);
        color: var(--text-primary);
        font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: auto;
      }
      #stage { width: 100%; display: flex; justify-content: center; padding: 40px 0 96px; }

      .card {
        background: var(--bg-secondary);
        border: 1px solid var(--divider);
        border-radius: 12px;
        box-shadow: var(--shadow-popup);
        max-height: calc(100vh - 130px);
        overflow-y: auto;
      }
      .kbd {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--bg-code);
        border: 1px solid var(--divider);
        color: var(--text-secondary);
      }
      .linkrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 8px;
        border-radius: 6px;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        font-size: 13px;
        cursor: pointer;
        text-decoration: none;
      }
      .linkrow:hover { color: var(--text-primary); background: var(--hover-bg-subtle); }
      .linkrow img, .linkrow svg { width: 15px; height: 15px; object-fit: contain; }

      #proto-bar {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #0b0b0f;
        border: 1px solid #2a2a33;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        color: #d8d8e0;
        font-size: 12px;
        z-index: 999;
        user-select: none;
      }
      #proto-bar button {
        width: 26px; height: 26px;
        border-radius: 50%;
        border: 1px solid #33333d;
        background: #17171f;
        color: #d8d8e0;
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
      }
      #proto-badge {
        position: fixed;
        top: 14px; left: 14px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: var(--text-muted);
        border: 1px dashed var(--divider);
        border-radius: 6px;
        padding: 4px 8px;
        z-index: 999;
        pointer-events: none;
      }
      #proto-state {
        position: fixed;
        top: 14px; right: 14px;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: var(--text-muted);
        z-index: 999;
        pointer-events: none;
      }

      /* ---------- E/F：宋体纸页（原内容 + A 的结构） ---------- */
      .paper {
        --p-ink: #2b2724;
        --p-muted: #6b6560;
        --p-rule: rgba(43, 39, 36, 0.16);
        --p-accent: #b84a14;
        width: 600px;
        padding: 28px 36px 26px;
        border-radius: 2px;
        background: #f6f0e4;
        border: 1px solid rgba(43, 39, 36, 0.15);
        color: var(--p-ink);
        font-family: "Songti SC", "Source Han Serif SC", "Noto Serif CJK SC",
          "SimSun", "STSong", serif;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
      }
      .paper.dark {
        --p-ink: var(--text-primary);
        --p-muted: var(--text-muted);
        --p-rule: var(--divider);
        --p-accent: var(--brand-primary);
        background: var(--bg-reader);
        border-color: var(--divider);
      }
      .paper .p-head { display: flex; align-items: center; gap: 14px; }
      .paper .p-head svg.tile { width: 72px; height: 72px; flex-shrink: 0; }
      .paper .p-head { gap: 16px; }
      .paper h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.02em; }
      .paper .p-sub { margin: 3px 0 0; font-size: 13px; color: var(--p-muted); letter-spacing: 0.02em; }
      .paper .p-meta {
        margin: 5px 0 0;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        color: var(--p-muted);
      }
      .paper .p-state { margin-left: auto; font-size: 12px; color: var(--p-muted); }
      .paper .p-claim { margin: 18px 0 0; font-size: 13.5px; line-height: 1.9; }
      .paper .p-slogan { margin: 6px 0 0; font-size: 13.5px; line-height: 1.9; color: var(--p-muted); }
      .paper .p-features {
        margin: 12px 0 0;
        font-size: 12px;
        letter-spacing: 0.02em;
        color: var(--p-muted);
        text-align: center;
      }
      .paper .p-rule { height: 1px; background: var(--p-rule); margin: 18px 0 16px; }
      .paper .p-author { display: flex; gap: 12px; align-items: flex-start; }
      .paper .p-author img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--p-rule); flex-shrink: 0; }
      .paper .p-author b { font-size: 14px; font-weight: 600; }
      .paper .p-author p { margin: 5px 0 0; font-size: 13px; line-height: 1.8; color: var(--p-muted); }
      .paper .p-quote { margin: 14px 0 0; font-size: 13px; line-height: 1.8; color: var(--p-ink); text-align: right; }
      .paper .p-links { display: flex; align-items: center; justify-content: center; gap: 18px; }
      .paper .p-links a, .paper .p-links button {
        display: inline-flex; align-items: center; gap: 6px;
        background: none; border: none; padding: 0;
        color: var(--p-accent);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 4px;
        text-decoration-thickness: 1px;
      }
      .paper .p-links img, .paper .p-links svg { width: 14px; height: 14px; object-fit: contain; }
      .paper .p-qr { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 14px; }
      .paper .p-qr img { width: 132px; height: 132px; border-radius: 2px; border: 1px solid var(--p-rule); }

      /* ---------- A：版权页 ---------- */
      .a { width: 560px; padding: 24px 28px 22px; }
      .a .rule { height: 2px; width: 56px; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-pink)); margin-bottom: 16px; }
      .a .titlerow { display: flex; align-items: baseline; gap: 12px; }
      .a h1 { margin: 0; font-size: 18px; font-weight: 700; }
      .a .state { margin-left: auto; font-size: 12px; color: var(--text-muted); }
      .a .meta { margin: 5px 0 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--text-muted); }
      .a .claim { margin: 14px 0 0; font-size: 13px; line-height: 1.8; color: var(--text-secondary); }
      .a .who { display: flex; align-items: center; gap: 9px; margin-top: 16px; }
      .a .who img { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--divider); }
      .a .who b { font-size: 14px; font-weight: 600; }
      .a .who span { font-size: 12px; color: var(--text-muted); }
      .a .bio { margin: 8px 0 0; font-size: 12.5px; line-height: 1.7; color: var(--text-secondary); }
      .a .links { display: flex; gap: 4px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--divider); }
      .a .qr { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
      .a .qr img { width: 132px; height: 132px; border-radius: 6px; }

      /* ---------- B：名片（左右分栏） ---------- */
      .b { width: 700px; display: flex; overflow: hidden; }
      .b .rail {
        width: 212px; flex-shrink: 0; padding: 24px 20px;
        background: var(--bg-sidebar);
        border-right: 1px solid var(--divider);
        display: flex; flex-direction: column;
      }
      .b .rail img.app { width: 64px; height: 64px; border-radius: 12px; }
      .b .rail svg.app { width: 64px; height: 64px; border-radius: 12px; }
      .b .rail h1 { margin: 14px 0 0; font-size: 18px; font-weight: 700; }
      .b .rail .ver { margin-top: 4px; font-size: 12px; color: var(--text-muted); font-family: ui-monospace, Consolas, monospace; }
      .b .rail .lic { margin-top: auto; font-size: 12px; color: var(--text-muted); }
      .b .body { padding: 24px 26px; min-width: 0; }
      .b .claim { margin: 0; font-size: 15px; line-height: 1.75; color: var(--text-primary); }
      .b .sub { margin: 8px 0 0; font-size: 13px; line-height: 1.8; color: var(--text-secondary); }
      .b .who { display: flex; align-items: center; gap: 9px; margin-top: 18px; }
      .b .who img { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--divider); }
      .b .who b { font-size: 14px; font-weight: 600; }
      .b .who span { font-size: 12px; color: var(--text-muted); }
      .b .bio { margin: 6px 0 0 35px; font-size: 12.5px; line-height: 1.7; color: var(--text-secondary); }
      .b .links { display: flex; gap: 4px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--divider); }
      .b .qr { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
      .b .qr img { width: 128px; height: 128px; border-radius: 6px; }

      /* ---------- C：信笺 ---------- */
      .c { width: 540px; padding: 30px 36px 26px; }
      .c .head { display: flex; align-items: baseline; justify-content: space-between; }
      .c .brand { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
      .c .date { font-size: 12px; color: var(--text-muted); font-family: ui-monospace, Consolas, monospace; }
      .c .salut { margin: 22px 0 0; font-size: 14px; color: var(--text-primary); }
      .c p.body-text { margin: 12px 0 0; font-size: 13.5px; line-height: 1.95; color: var(--text-secondary); }
      .c .sig { margin-top: 18px; text-align: right; }
      .c .sig .name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
      .c .sig .role { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
      .c .ps { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--divider); font-size: 12.5px; color: var(--text-muted); }
      .c .ps .links { display: flex; gap: 4px; margin-top: 6px; }
      .c .qr { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
      .c .qr img { width: 128px; height: 128px; border-radius: 6px; }

      /* ---------- D：书目卡 ---------- */
      .d { width: 640px; padding: 24px 28px 22px; }
      .d .kick { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
      .d h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; }
      .d .grid { margin-top: 16px; display: grid; grid-template-columns: 96px 1fr; row-gap: 0; }
      .d .grid .k { padding: 7px 0; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--divider); }
      .d .grid .v { padding: 7px 0; font-size: 13px; color: var(--text-secondary); border-top: 1px solid var(--divider); }
      .d .grid .v a { color: var(--text-secondary); text-decoration: none; }
      .d .grid .v a:hover { color: var(--text-primary); }
      .d .quote { margin: 16px 0 0; font-size: 12.5px; color: var(--text-muted); }
      .d .qr { display: flex; gap: 14px; align-items: center; margin-top: 10px; }
      .d .qr img { width: 120px; height: 120px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="proto-badge">PROTOTYPE · About variants · ← → 或 ?variant=A|B|C|D</div>
    <div id="proto-state"></div>
    <div id="stage"></div>
    <div id="proto-bar">
      <button id="prev" aria-label="上一个方案">←</button>
      <span id="label"></span>
      <button id="next" aria-label="下一个方案">→</button>
      <span style="opacity:.5">|</span>
      <span id="qrstate"></span>
    </div>

    <script>
      const CLAIM =
        "基于 Tauri 2 构建，专注沉浸、高性能的阅读：打开就是排好版的样子，多主题、目录导航、全文搜索与阅读进度都在。";
      const SLOGAN = "让每一次阅读，都回归内容本身。";
      const AUTHOR = "宝藏二哥 AIA";
      const BIO =
        "一个爱分享的技术大叔：折腾 AI 绘画、AI 编程和 AI 办公，也在全网搜罗好用的 PC 软件与提效神器；分享只守三条——无门槛、无套路、无保留。";
      const QUOTE = "AI 不应该有门槛，助力百万普通人用上 AI";
      const VERSION = "0.6.1";
      const LICENSE = "AGPL-3.0 · 免费 · 开源";

      const GITHUB_ICON =
        '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>';

      const qrBlock = (state, cls) =>
        state.qr
          ? `<div class="${cls}"><img src="/images/qr-friend.png" alt="微信二维码" /><span style="font-size:12px;line-height:1.7;color:var(--text-muted)">加个好友，常来唠嗑</span></div>`
          : "";

      const links = (state) => `
        <a class="linkrow" href="https://github.com/ErgeAIA/ErgeMD" target="_blank" rel="noreferrer">${GITHUB_ICON}<span>GitHub 仓库</span></a>
        <a class="linkrow" href="https://space.bilibili.com/67221461" target="_blank" rel="noreferrer"><img src="/images/bilibili.png" alt="" /><span>B 站主页</span></a>
        <button class="linkrow" data-action="wechat" aria-expanded="${state.qr}"><img src="/images/Wechat-ico.png" alt="" /><span>微信</span></button>`;

      const paperLinks = (s) => `
        <a href="https://github.com/ErgeAIA/ErgeMD" target="_blank" rel="noreferrer">${GITHUB_ICON}<span>GitHub</span></a>
        <a href="https://space.bilibili.com/67221461" target="_blank" rel="noreferrer"><img src="/images/bilibili.png" alt="" /><span>B 站</span></a>
        <button data-action="wechat" aria-expanded="${s.qr}"><img src="/images/Wechat-ico.png" alt="" /><span>微信</span></button>`;

      const APP_LOGO = `
        <svg class="tile" viewBox="0 0 1024 1024" aria-hidden="true" style="width:72px;height:72px">
          <defs>
            <linearGradient id="pBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--accent-cyan, #00E5FF)" />
              <stop offset="100%" stop-color="var(--accent-pink, #FF007F)" />
            </linearGradient>
            <linearGradient id="pNeonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="var(--accent-pink, #FF007F)" />
              <stop offset="100%" stop-color="var(--accent-pink, #FF5E99)" />
            </linearGradient>
          </defs>
          <rect x="112" y="112" width="800" height="800" rx="180" fill="none" stroke="url(#pBoxGrad)" stroke-width="20" opacity="0.55" />
          <rect x="112" y="112" width="800" height="800" rx="180" fill="var(--bg-page, #0A0B10)" fill-opacity="0.9" stroke="url(#pBoxGrad)" stroke-width="14" />
          <g fill="none" stroke="url(#pNeonGrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 510 260 L 330 260 L 330 620 L 510 620" />
            <path d="M 480 440 L 740 440 M 650 300 L 740 440 L 650 580" />
          </g>
          <text x="512" y="790" font-family="sans-serif" font-size="80" font-weight="600" fill="var(--accent-cyan, #00F0FF)" text-anchor="middle" letter-spacing="4">ErgeMD</text>
        </svg>`;

      function paper(s, dark, tileId) {
        return `
          <div class="card paper ${dark ? "dark" : ""}">
            <div class="p-head">
              ${APP_LOGO}
              <div>
                <h1>ErgeMD</h1>
                <p class="p-sub">极简 Markdown 阅读器</p>
                <p class="p-meta">v${VERSION} · ${LICENSE}</p>
              </div>
              <span class="p-state">已是最新</span>
            </div>
            <p class="p-claim">${CLAIM}</p>
            <p class="p-slogan">— ${SLOGAN}</p>
            <p class="p-features">Mermaid 图表 · 多格式导出</p>
            <div class="p-rule"></div>
            <div class="p-author">
              <img src="/images/avatar.png" alt="" />
              <div><b>${AUTHOR}</b><p>${BIO}</p></div>
            </div>
            <p class="p-quote">—— ${QUOTE}</p>
            <div class="p-rule"></div>
            <div class="p-links">${paperLinks(s)}</div>
            ${qrBlock(s, "p-qr")}
          </div>`;
      }

      const V = {
        A: {
          name: "版权页（单列）",
          render: (s) => `
            <div class="card a">
              <div class="rule"></div>
              <div class="titlerow"><h1>ErgeMD</h1><span class="state">v${VERSION} · 已是最新</span></div>
              <p class="meta">v${VERSION} · ${LICENSE}</p>
              <p class="claim">${CLAIM}<br/>${SLOGAN}</p>
              <div class="who"><img src="/images/avatar.png" alt="" /><b>${AUTHOR}</b><span>作者</span></div>
              <p class="bio">${BIO}</p>
              <div class="links">${links(s)}</div>
              ${qrBlock(s, "qr")}
            </div>`,
        },
        B: {
          name: "名片（左右分栏）",
          render: (s) => `
            <div class="card b">
              <div class="rail">
                <svg class="app" viewBox="0 0 64 64" aria-hidden="true">
                  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="var(--accent-cyan)" /><stop offset="1" stop-color="var(--accent-pink)" />
                  </linearGradient></defs>
                  <rect width="64" height="64" rx="14" fill="url(#brand)" />
                  <path d="M20 17h25v7H28v6h14v6H28v6h17v7H20z" fill="#12121a" />
                </svg>
                <h1>ErgeMD</h1>
                <div class="ver">v${VERSION}</div>
                <div class="lic">${LICENSE}</div>
              </div>
              <div class="body">
                <p class="claim">${SLOGAN}</p>
                <p class="sub">${CLAIM}</p>
                <div class="who"><img src="/images/avatar.png" alt="" /><b>${AUTHOR}</b><span>一人公司</span></div>
                <p class="bio">${BIO}</p>
                <div class="links">${links(s)}</div>
                ${qrBlock(s, "qr")}
              </div>
            </div>`,
        },
        C: {
          name: "信笺（致读者）",
          render: (s) => `
            <div class="card c">
              <div class="head"><span class="brand">ErgeMD · 关于</span><span class="date">2026-11 · v${VERSION}</span></div>
              <p class="salut">致读者：</p>
              <p class="body-text">这是一个只做阅读的 Markdown 工具。同一份笔记放进来，它会比通用编辑器更接近成品：Obsidian 的 Callout、嵌入与高亮都认，14 套主题连代码和图表一起换色，几万字的长文滚动也不打嗝。</p>
              <p class="body-text">它是我一个人写的：免费、无账号、不联网，也不收集你的任何东西。</p>
              <p class="body-text">${QUOTE}。${SLOGAN}</p>
              <div class="sig"><div class="name">${AUTHOR}</div><div class="role">${LICENSE}</div></div>
              <div class="ps">P.S. 有问题、想催更，从下面任意一个入口找我${s.qr ? "" : "（微信点开是二维码）"}。
                <div class="links">${links(s)}</div>
              </div>
              ${qrBlock(s, "qr")}
            </div>`,
        },
        D: {
          name: "书目卡（字段优先）",
          render: (s) => `
            <div class="card d">
              <div class="kick">About / 关于</div>
              <h1>ErgeMD</h1>
              <div class="grid">
                <div class="k">版本</div><div class="v">v${VERSION} · 已是最新</div>
                <div class="k">许可</div><div class="v">${LICENSE}</div>
                <div class="k">作者</div><div class="v">${AUTHOR}</div>
                <div class="k">源码</div><div class="v"><a href="https://github.com/ErgeAIA/ErgeMD" target="_blank" rel="noreferrer">github.com/ErgeAIA/ErgeMD</a></div>
                <div class="k">视频</div><div class="v"><a href="https://space.bilibili.com/67221461" target="_blank" rel="noreferrer">space.bilibili.com/67221461</a></div>
                <div class="k">微信</div><div class="v"><button class="linkrow" data-action="wechat" style="padding:0" aria-expanded="${s.qr}">点击查看二维码</button></div>
              </div>
              ${qrBlock(s, "qr")}
              <p class="quote">“${QUOTE}” —— ${AUTHOR}</p>
            </div>`,
        },
        E: { name: "纸页·亮（宋体）", render: (s) => paper(s, false, "tileE") },
        F: { name: "纸页·暗（宋体）", render: (s) => paper(s, true, "tileF") },
      };
      const ORDER = ["A", "B", "C", "D", "E", "F"];

      const params = new URLSearchParams(location.search);
      const state = {
        v: ORDER.includes(params.get("variant")) ? params.get("variant") : "A",
        qr: params.get("qr") === "1",
      };

      function render() {
        document.getElementById("stage").innerHTML = V[state.v].render(state);
        document.getElementById("label").textContent = `${state.v} · ${V[state.v].name}`;
        document.getElementById("qrstate").textContent = `微信二维码：${state.qr ? "开" : "关"}`;
        document.getElementById("proto-state").textContent = `variant=${state.v} qr=${state.qr ? "on" : "off"}`;
      }

      function setVariant(v) {
        state.v = v;
        state.qr = false;
        history.replaceState(null, "", `?variant=${v}`);
        render();
      }
      function cycle(dir) {
        const i = ORDER.indexOf(state.v);
        setVariant(ORDER[(i + dir + ORDER.length) % ORDER.length]);
      }

      document.getElementById("prev").addEventListener("click", () => cycle(-1));
      document.getElementById("next").addEventListener("click", () => cycle(1));
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action='wechat']");
        if (btn) {
          state.qr = !state.qr;
          render();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && state.qr) {
          state.qr = false;
          render();
          return;
        }
        if (e.target.closest("input, textarea, [contenteditable]")) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
      });

      render();
    </script>
  </body>
</html>
