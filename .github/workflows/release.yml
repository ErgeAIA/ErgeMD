name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build and publish (e.g. v0.4.3)'
        required: true

permissions:
  contents: write

# tag 推送时为 tag 名；workflow_dispatch 补跑时为输入的 tag——
# 构建/上传产物命名与 release 定位必须用它，而非 github.ref_name（dispatch 时是分支名）
env:
  TAG_NAME: ${{ inputs.tag_name || github.ref_name }}

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm test
      - name: cargo test
        run: cd src-tauri && cargo test

  build:
    name: Build ${{ matrix.platform }} (${{ matrix.suffix }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
    runs-on: ${{ matrix.platform }}
    env:
      # createUpdaterArtifacts: true 时构建必须签名；无密码私钥，PASSWORD 留空即可
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Linux deps
        if: matrix.suffix == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install
      - name: Build Tauri app
        # 放弃 tauri-action@v0：之前步骤 0.13s 完成，根本没跑 build
        # 改用显式 pnpm tauri build，可控 100%
        shell: pwsh
        run: pnpm tauri build --target ${{ matrix.target }}
      - name: Rename bundles
        env:
          BUILD_PLATFORM: ${{ matrix.suffix }}
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/rename-bundle.js
      - name: Create portable package (Windows)
        if: matrix.suffix == 'windows-x64'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $src = "src-tauri/target/$target/release"
          $dst = "ErgeMD-portable"
          New-Item -ItemType Directory -Force -Path $dst
          # After rename-bundle.js, exe is named ErgeMD-v0.4.1.exe
          Copy-Item "$src/ErgeMD-${{ env.TAG_NAME }}.exe" $dst/ErgeMD.exe
          Copy-Item "$src/*.dll" $dst/ -ErrorAction SilentlyContinue
          if (Test-Path "$src/WebView2Loader.dll") {
            Copy-Item "$src/WebView2Loader.dll" $dst/
          }
          Compress-Archive -Path $dst -DestinationPath "ErgeMD-${{ env.TAG_NAME }}-windows-x64-portable.zip" -Force
      - name: Upload updater artifacts (installer + signature)
        uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.suffix }}
          path: |
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/nsis/*.exe.sig
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/dmg/ErgeMD-*-macos-*.dmg
            src-tauri/target/**/release/bundle/deb/*.deb
            ErgeMD-${{ env.TAG_NAME }}-windows-x64-portable.zip
          if-no-files-found: error
      # Release 页正文 = CHANGELOG 对应版本段落（与更新卡片同源）；缺段落时回退占位文案
      - name: Extract release notes from CHANGELOG
        run: |
          VER="${TAG_NAME#v}"
          awk -v start="## [$VER]" 'index($0, start) == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See the assets to download and install this version." > release-notes.md
          fi
      # 网盘分发用的逐个压缩包：夸克等平台会自动删除可执行文件（.exe / .AppImage / .deb / .dmg），
      # 传上去等于没传。**zip 是附加资产，不替换裸包**——更新清单从 artifact 里的裸包与 .sig 算签名，
      # 把产物换成 zip 会让已装客户端校验失败、再也收不到更新。
      # 工具只用系统自带的：Windows → PowerShell Compress-Archive/Expand-Archive；其余 → zip/unzip。
      # 不用 tar：git-bash 自带的 tar 是 GNU tar，写不出 zip（AI-Vault 同轮实测）。
      - name: Zip each release asset for netdisk sharing
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-zips && mkdir -p release-zips
          # 判 OS 用 if/then 而不是 `uname | grep -q … && win=1`：后者的失败被 set -e 豁免
          # （&& 列表里非末位的命令不触发退出，本机实测复合语句返回 1 而脚本照跑），
          # 但它让整个复合语句返回非零、读起来像在 set -e 下会中止——if/then 消掉这层歧义。
          win=0
          if uname -s | grep -qiE 'mingw|msys'; then win=1; fi
          zip_one() {
            local f="$1" out="release-zips/$(basename "$f").zip"
            if [ "$win" = 1 ]; then
              powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -Path '$f' -DestinationPath '$out' -Force"
            else
              # -j 去路径：包内成员必须是原文件名，用户解出来就能直接跑
              zip -q -j -X "$out" "$f"
            fi
          }
          verify_one() {
            local f="$1" base out="release-zips/$(basename "$f").zip"
            base="$(basename "$f")"
            rm -rf _verify && mkdir -p _verify
            if [ "$win" = 1 ]; then
              powershell -NoProfile -ExecutionPolicy Bypass -Command "Expand-Archive -Path '$out' -DestinationPath '_verify' -Force"
            else
              unzip -q -o "$out" -d _verify
            fi
            if [ ! -f "_verify/$base" ] || ! cmp -s "$f" "_verify/$base"; then
              echo "::error::$base.zip 解压回读校验失败（成员名或字节与裸包不一致）"
              ls -l _verify || true
              exit 1
            fi
            rm -rf _verify
          }
          made=0
          while IFS= read -r f; do
            case "$(basename "$f")" in *.zip|*.sig) continue ;; esac   # 已是压缩包的不重复包
            zip_one "$f"
            out="release-zips/$(basename "$f").zip"
            [ -s "$out" ] || { echo "::error::$out 没生成或为空"; exit 1; }
            verify_one "$f"
            made=$((made + 1))
          done < <(find . -path ./release-zips -prune -o -type f \( \
                      -name "ErgeMD-${TAG_NAME}-setup.exe" \
                      -o -name "ErgeMD-${TAG_NAME}-macos-*.dmg" \
                      -o -name "ErgeMD-${TAG_NAME}-linux-*.AppImage" \
                      -o -name "ErgeMD-${TAG_NAME}-linux-*.deb" \) -print)
          if [ "$made" -eq 0 ]; then
            echo "::error::本轮没找到任何可压缩的发布产物（命名与 TAG_NAME=$TAG_NAME 不符？）"
            exit 1
          fi
          echo "本轮生成并回读校验 $made 个压缩包："
          ls -l release-zips
      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/ErgeMD-${{ env.TAG_NAME }}-setup.exe
            **/ErgeMD-${{ env.TAG_NAME }}-macos-*.dmg
            **/ErgeMD-${{ env.TAG_NAME }}-linux-*.AppImage
            **/ErgeMD-${{ env.TAG_NAME }}-linux-*.deb
            ErgeMD-${{ env.TAG_NAME }}-windows-x64-portable.zip
            release-zips/*.zip
          tag_name: ${{ env.TAG_NAME }}
          name: 'ErgeMD ${{ env.TAG_NAME }}'
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 更新分发：汇总三平台签名产物 → 生成 updater manifest → 发布到 updates-dist
  # （单一来源：GitHub updates-dist 仓清单 + GitHub Release 安装包；Gitee 分发已下线）
  publish-updater:
    name: Publish updater manifest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      # job 级 env 不允许引用 env context（GitHub 求值限制），此处直接取触发源
      TAG: ${{ inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ErgeAIA/updates-dist
          token: ${{ secrets.RELEASE_TOKEN }}
          path: updates-dist
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble manifest and publish (GitHub)
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          DIST="updates-dist/ergemd"
          RELEASE_DIR="release-assets"
          mkdir -p "$DIST" "$RELEASE_DIR"

          # 收集签名产物，统一命名（无空格；GitHub 附件会把空格转点导致 url 404）。
          # v2 签名文件命名各平台不一致（规范名/原始名混合），一律按 .sig 模式查找配对
          EXE=$(find artifacts -name "*.exe" ! -name "*.sig" | head -1)
          EXESIG=$(find artifacts -name "*.exe.sig" | head -1)
          TARGZ=$(find artifacts -name "*.app.tar.gz" | head -1)
          TARGZSIG=$(find artifacts -name "*.app.tar.gz.sig" | head -1)
          APPIMAGE=$(find artifacts -name "*.AppImage" ! -name "*.sig" | head -1)
          APPIMAGESIG=$(find artifacts -name "*.AppImage.sig" | head -1)
          [ -n "$EXE" ] && [ -n "$EXESIG" ] && [ -n "$TARGZ" ] && [ -n "$TARGZSIG" ] && \
            [ -n "$APPIMAGE" ] && [ -n "$APPIMAGESIG" ] || {
            echo "::error::签名产物不齐：exe=$EXE exe.sig=$EXESIG tar.gz=$TARGZ tar.gz.sig=$TARGZSIG AppImage=$APPIMAGE AppImage.sig=$APPIMAGESIG"
            exit 1
          }
          cp "$EXE" "$RELEASE_DIR/ErgeMD_${VER}_x64-setup.exe"
          cp "$EXESIG" "$RELEASE_DIR/ErgeMD_${VER}_x64-setup.exe.sig"
          cp "$TARGZ" "$RELEASE_DIR/ErgeMD_${VER}_aarch64.app.tar.gz"
          cp "$TARGZSIG" "$RELEASE_DIR/ErgeMD_${VER}_aarch64.app.tar.gz.sig"
          cp "$APPIMAGE" "$RELEASE_DIR/ErgeMD_${VER}_amd64.AppImage"
          cp "$APPIMAGESIG" "$RELEASE_DIR/ErgeMD_${VER}_amd64.AppImage.sig"

          # 全量产物镜像：主仓库 Release 的全部产物在 updates-dist 同步一份
          # （updater 三件套用上方规范名；dmg / deb / portable.zip 沿用 Release 同名文件）
          find artifacts -name "ErgeMD-*.dmg" -exec cp {} "$RELEASE_DIR/" \;
          find artifacts -name "ErgeMD-*.deb" -exec cp {} "$RELEASE_DIR/" \;
          find artifacts -name "ErgeMD-*-portable.zip" -exec cp {} "$RELEASE_DIR/" \;

          # notes：CHANGELOG 对应版本段落（与更新卡片的分组解析同源）
          awk -v start="## [$VER]" 'index($0, start) == 1 { f = 1; next } f && /^## \[/ { exit } f' \
            CHANGELOG.md > notes.md

          # GitHub 版 manifest（url 指 updates-dist release 附件）
          node - "$VER" "$TAG" <<'EOF'
          const fs = require("fs");
          const [ver, tag] = process.argv.slice(2);
          const base = `https://github.com/ErgeAIA/updates-dist/releases/download/ergemd-${tag}`;
          const platforms = {};
          const sig = (f) => fs.readFileSync(`release-assets/${f}.sig`, "utf8").trim();
          platforms["windows-x86_64"] = { signature: sig(`ErgeMD_${ver}_x64-setup.exe`), url: `${base}/ErgeMD_${ver}_x64-setup.exe` };
          platforms["darwin-aarch64"] = { signature: sig(`ErgeMD_${ver}_aarch64.app.tar.gz`), url: `${base}/ErgeMD_${ver}_aarch64.app.tar.gz` };
          platforms["linux-x86_64"] = { signature: sig(`ErgeMD_${ver}_amd64.AppImage`), url: `${base}/ErgeMD_${ver}_amd64.AppImage` };
          const manifest = {
            version: ver,
            notes: fs.readFileSync("notes.md", "utf8"),
            pub_date: new Date().toISOString(),
            platforms,
          };
          fs.writeFileSync("updates-dist/ergemd/updates.json", JSON.stringify(manifest, null, 2) + "\n");
          EOF

          # GitHub updates-dist：建 release 传安装包 + 推清单（正文 = CHANGELOG 对应版本段落）
          gh release create "ergemd-$TAG" --repo ErgeAIA/updates-dist \
            --title "ErgeMD $TAG" --notes-file notes.md || true
          gh release upload "ergemd-$TAG" --repo ErgeAIA/updates-dist \
            "$RELEASE_DIR"/* --clobber || true
          cd updates-dist
          git config user.name "ErgeAIA"
          git config user.email "ergeaia@users.noreply.github.com"
          git add -A
          git commit -m "ergemd: $TAG" || true
          git push origin HEAD:main
  # 依赖缓存清理：与 AI-Vault 同口径（DEC-043）。规则只两条，都不碰默认分支的活缓存，命中率不受影响：
  #   ① ref 不是默认分支的一律删——缓存有分支作用域，tag 上写下的那一份下一次运行永远取不到
  #      （本仓实测 5 条 / 2.1 GiB 挂在 refs/heads/refs/tags/v0.5.0 上，2026-10-23 手工清掉）；
  #   ② 默认分支内同一 key 只保留最新一条，等价于「只保留上一次的缓存」。
  # GitHub 只在仓库撞到每仓库 10 GiB 上限时才按最后访问时间逐出，平时不清，所以要自己跑在逐出之前。
  # 挂在构建之后（if: always()）：build/test 作业开头要 restore，抢先删会让那一次冷编译。
  cleanup-caches:
    needs: [test, build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete caches that can never be reused
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # 读不到默认分支就收手：否则 select(.ref != "") 会把全部缓存判成「非默认分支」删光
          branch="$(gh api "repos/${GH_REPO}" --jq .default_branch)" || branch=""
          if [ -z "$branch" ]; then
            echo "::error::拿不到默认分支名，跳过缓存清理（宁可不删）"
            exit 0
          fi
          DEFAULT_REF="refs/heads/${branch}"
          echo "默认分支 ${DEFAULT_REF}"
          off="$(gh cache list --limit 100 --json id,ref,key,sizeInBytes \
            --jq "[.[] | select(.ref != \"${DEFAULT_REF}\")] | .[] | \"\(.id) \(.sizeInBytes)B \(.ref) \(.key)\"" || true)"
          dup="$(gh cache list --limit 100 --json id,ref,key,createdAt \
            --jq "[.[] | select(.ref == \"${DEFAULT_REF}\")] | group_by(.key)[] | sort_by(.createdAt) | .[:-1][] | \"\(.id) \(.key)\"" || true)"
          echo "非默认分支作用域：$(printf '%s\n' "$off" | grep -c '^[0-9]') 条"
          printf '%s\n' "$off" | sed '/^[0-9]/!d'
          echo "同 key 冗余：$(printf '%s\n' "$dup" | grep -c '^[0-9]') 条"
          printf '%s\n' "$dup" | sed '/^[0-9]/!d'
          for id in $(printf '%s\n' "$off" "$dup" | sed -n 's/^\([0-9][0-9]*\).*/\1/p'); do
            echo "delete cache ${id}"
            gh cache delete "$id" || true
          done
